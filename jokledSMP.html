<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jokledSMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf8fb;--panel:#fff;--ink:#062b35;--mute:#3f6571;--line:#062b35;--accent:#00e5ff;--link:#006d80;--btn-ink:#032229;--shade:#0a6c80;--glow:rgba(0,180,210,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04080c;--panel:#09131a;--ink:#e6fbff;--mute:#8fb4bf;--line:#00e5ff;--link:#00e5ff;--glow:rgba(0,229,255,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#04080c;--panel:#09131a;--ink:#e6fbff;--mute:#8fb4bf;--line:#00e5ff;--link:#00e5ff;--glow:rgba(0,229,255,.28);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "DM Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.px{font-family:"Pixelify Sans","Courier New",monospace;font-weight:700;line-height:1.1;margin:0}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:3px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand img{height:44px;display:block}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav a{font:700 18px "Pixelify Sans",monospace;color:var(--ink);text-decoration:none;padding:6px 12px;border:3px solid transparent}
nav a[aria-current="page"]{border-color:var(--line);background:var(--panel)}
nav a:hover{border-color:var(--line)}
.tools{display:flex;gap:8px;align-items:center}
.chip{font:700 15px "Pixelify Sans",monospace;color:var(--ink);background:var(--panel);border:3px solid var(--line);padding:5px 10px;cursor:pointer}
.chip:hover{background:var(--accent);color:var(--btn-ink)}
main{max-width:1080px;margin:auto;padding:36px 20px 70px}
.view{display:none}.view.on{display:block}
.hero{text-align:center;padding:30px 0 10px}
.hero img{width:min(620px,92%);filter:drop-shadow(0 0 28px var(--glow))}
.hero p{max-width:52ch;margin:14px auto 22px;color:var(--mute);font-size:19px}
.ip{display:inline-flex;align-items:stretch;border:3px solid var(--line);background:var(--panel);box-shadow:5px 5px 0 var(--shade)}
.ip code{padding:12px 18px;font:700 20px "Pixelify Sans",monospace;word-break:break-all}
.btn{font:700 18px "Pixelify Sans",monospace;background:var(--accent);color:var(--btn-ink);border:3px solid var(--line);padding:10px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--shade);text-decoration:none;display:inline-block}
.btn:hover{transform:translate(-1px,-1px)}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shade)}
.ip .btn{box-shadow:none;border:0;border-left:3px solid var(--line)}
.quick{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.ver{margin-top:16px;color:var(--mute);font-size:15px}
h2{font-size:clamp(30px,5vw,44px);margin-bottom:6px}
.lead{color:var(--mute);margin:0 0 26px;max-width:60ch}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shade);padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
label{display:block;font-weight:700;margin-bottom:6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:10px 12px;margin-bottom:14px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:16px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.steps li::before{content:counter(s);font:700 26px "Pixelify Sans",monospace;background:var(--accent);color:var(--btn-ink);border:3px solid var(--line);width:48px;height:48px;display:grid;place-items:center}
.steps b{display:block}.steps span{color:var(--mute)}
.vote{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:2px dashed var(--mute)}
.vote:first-of-type{border-top:0}
.price{font:700 28px "Pixelify Sans",monospace;margin:10px 0}
.item p{color:var(--mute);margin:6px 0 0}
.cart{margin-top:28px}.cart ul{list-style:none;padding:0;margin:10px 0}
.cart li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px dashed var(--mute)}
.note{font-size:14px;color:var(--mute)}
#recent li{padding:6px 0;border-bottom:2px dashed var(--mute)}
.who{display:none}.who.on{display:inline-flex}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--btn-ink);border:3px solid var(--line);font:700 17px "Pixelify Sans",monospace;padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
footer{border-top:3px solid var(--line);padding:22px 20px;text-align:center;color:var(--mute);font-size:14px}
@media (max-width:640px){nav{order:3;flex-basis:100%}.brand img{height:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<section class="view" id="v-vote">
<h2 data-t="vote_h"></h2><p class="lead" data-t="vote_p"></p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<div class="panel"><p class="note" id="voteWho"></p>
<div id="sites"></div></div>
<div class="panel"><h3 data-t="rew_h"></h3><ul id="rewards" style="padding-left:20px;margin:12px 0 0"></ul></div>
</div></section>

<section class="view" id="v-shop">
<h2 data-t="shop_h"></h2><p class="lead" data-t="shop_p"></p>
<div class="grid" id="items"></div>
<div class="panel" style="margin-top:28px"><h3 data-t="recent_h"></h3><ul id="recent" style="list-style:none;padding:0;margin:10px 0 0"></ul></div>
<div class="panel cart"><h3 data-t="cart_h"></h3><ul id="cartList"></ul>
<div class="price" id="total"></div>
<button class="btn" type="button" id="checkout" data-t="checkout"></button></div>
</section>

<section class="view" id="v-login">
<div style="max-width:440px;margin:auto"><h2 id="lgH"></h2><p class="lead" data-t="login_p"></p>
<div class="panel" id="lgBox">
<label for="lUser" data-t="mc_user"></label><input id="lUser" autocomplete="username" maxlength="16">
<label for="lPass" data-t="pass"></label><input id="lPass" type="password" autocomplete="current-password">
<button class="btn" type="button" id="lgGo"></button>
<p><a href="#login" id="lgSwap"></a></p>
<p class="note" id="demo"></p></div>
<div class="panel" id="lgOut" style="display:none"><h3 id="lgHi"></h3><p></p><button class="btn" type="button" id="logout" data-t="logout"></button></div>
</div></section>
</main>
<footer data-t="foot"></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== À MODIFIER / EDIT ME ===== */
var CONFIG={
  ip:"jokledsmp.example.com",          // ton adresse de serveur / your server address
  version:"Java Edition 1.21.11",
  demoNotice:true,                      // mets false quand le login est vraiment relié / set false once login is real
  recent:[],                            // 3 derniers acheteurs / last 3 buyers, le plus récent en premier: {name:"Steve",shards:300}
  voteSites:[  // hours = temps d'attente avant de pouvoir revoter / cooldown in hours
    {name:"Vote site 1",url:"#",hours:24},{name:"Vote site 2",url:"#",hours:24},{name:"Vote site 3",url:"#",hours:12},
    {name:"Vote site 4",url:"#",hours:12},{name:"Vote site 5",url:"#",hours:6}],
  items:[
    {id:"s150",price:5.50,en:["150 Shards","Server currency."],fr:["150 Shards","Monnaie du serveur."]},
    {id:"s300",price:10,en:["300 Shards","Server currency."],fr:["300 Shards","Monnaie du serveur."]},
    {id:"s650",price:20,en:["650 Shards","Server currency."],fr:["650 Shards","Monnaie du serveur."]},
    {id:"s1300",price:40,en:["1300 Shards","Server currency."],fr:["1300 Shards","Monnaie du serveur."]},
    {id:"s3300",price:100,en:["3300 Shards","Server currency."],fr:["3300 Shards","Monnaie du serveur."]},
    
  ]
};
/* ================================ */
var L={
en:{nav_vote:"Vote",nav_join:"Join",nav_shop:"Shop",nav_login:"Log in",tagline:"A survival world built together. Grab your pickaxe and join the adventure.",copy:"Copy IP",copied:"IP copied!",

shop_h:"Shop",shop_p:"Shards are the server currency. Pick a pack.",add:"Add to cart",cart_h:"Your cart",empty:"Your cart is empty.",total:"Total",checkout:"Checkout",pay:"Payments aren’t connected yet.",remove:"Remove",

fr:{nav_vote:"Voter",nav_join:"Rejoindre",nav_shop:"Boutique",nav_login:"Connexion",tagline:"Un monde de survie construit ensemble. Prends ta pioche et rejoins l’aventure.",copy:"Copier l’IP",copied:"IP copiée !",
join_h:"Rejoindre le serveur",join_p:"Quatre étapes et tu es dedans.",j1:"Ouvre Minecraft Java Edition",j1d:"Utilise la version 1.21.11 pour pouvoir te connecter.",j2:"Va dans Multijoueur",j2d:"Puis choisis Ajouter un serveur.",j3:"Entre l’adresse du serveur",j4:"Clique sur Rejoindre le serveur",j4d:"Lis les règles ci-dessous et amuse-toi !",

shop_h:"Boutique",shop_p:"Les shards sont la monnaie du serveur. Choisis un pack.",add:"Ajouter au panier",cart_h:"Ton panier",empty:"Ton panier est vide.",total:"Total",checkout:"Payer",pay:"Les paiements ne sont pas encore reliés.",remove:"Retirer",
login_h:"Connexion",reg_h:"Créer un compte",login_p:"Utilise ton pseudo Minecraft pour accéder à ton compte.",pass:"Mot de passe",go_login:"Se connecter",go_reg:"Créer le compte",to_reg:"Pas de compte ? Crées-en un",to_login:"Déjà un compte ? Connecte-toi",demo:"Mode aperçu : les comptes ne sont pas encore enregistrés.",fill:"Remplis les deux champs.",hi:"Bienvenue, ",logout:"Se déconnecter",foot:"jokledSMP n’est pas affilié à Mojang ni à Microsoft.",ver:"Java Edition 1.21.11"}
};
var S={lang:"en",theme:"dark",cart:[],user:null,reg:false};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var $=function(i){return document.getElementById(i)};
function t(k){return L[S.lang][k]}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove("on")},2200)}
function money(n){return S.lang==="fr"?n.toFixed(2).replace(".",",")+" €":"€"+n.toFixed(2)}
function list(id,arr){var u=$(id);u.innerHTML="";arr.forEach(function(x){var li=document.createElement("li");li.textContent=x;u.appendChild(li)})}
function render(){
  document.documentElement.lang=S.lang==="fr"?"fr":"en-US";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.getAttribute("data-t"))});
  $("lang").textContent=S.lang==="fr"?"FR":"EN";
  $("theme").textContent=S.theme==="dark"?"☀":"☾";
  $("ipTxt").textContent=CONFIG.ip;$("ip2").textContent=CONFIG.ip;$("ver").textContent=CONFIG.version;
  list("rules",t("rules"));list("rewards",t("rewards"));
  var it=$("items");it.innerHTML="";
  CONFIG.items.forEach(function(x){var d=document.createElement("div");d.className="panel item";
    var h=document.createElement("h3");h.textContent=x[S.lang][0];var p=document.createElement("div");p.className="price";p.textContent=money(x.price);
    var q=document.createElement("p");q.textContent=x[S.lang][1];var b=document.createElement("button");b.type="button";b.className="btn";b.style.marginTop="14px";b.textContent=t("add");
    b.onclick=function(){S.cart.push(x.id);renderCart()};
    d.appendChild(h);d.appendChild(p);d.appendChild(q);d.appendChild(b);it.appendChild(d)});
  var rc=$("recent");rc.innerHTML="";var rr=(CONFIG.recent||[]).slice(0,3);
  if(!rr.length){var e=document.createElement("li");e.textContent=t("recent_none");rc.appendChild(e)}
  rr.forEach(function(r){var li=document.createElement("li");li.textContent=r.name+" — "+r.shards+" Shards";rc.appendChild(li)});
  renderCart();renderLogin();
}
function vkey(i){return "jk-vote:"+S.user+":"+i}
function left(i){var ts=parseInt(store(vkey(i)),10);if(!ts)return 0;return Math.max(0,ts+CONFIG.voteSites[i].hours*3600000-Date.now())}
function fmt(ms){var s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return (h?h+"h ":"")+(h||m?m+"m ":"")+s+"s"}
function renderVoteBtns(){document.querySelectorAll("#sites button").forEach(function(b){var l=left(+b.dataset.i);b.disabled=l>0;b.style.opacity=l>0?.6:1;b.textContent=l>0?fmt(l):t("votebtn")})}
function renderVotes(){
  var s=$("sites");s.innerHTML="";
  $("voteWho").textContent=S.user?"":t("vote_login");
  if(!S.user){var a=document.createElement("a");a.className="btn";a.href="#login";a.textContent=t("nav_login");s.appendChild(a);return}
  CONFIG.voteSites.forEach(function(v,i){
    var d=document.createElement("div");d.className="vote";
    var n=document.createElement("span");var nb=document.createElement("b");nb.textContent=v.name;n.appendChild(nb);
    var sm=document.createElement("small");sm.className="note";sm.style.display="block";sm.textContent=t("every")+" "+v.hours+" h";n.appendChild(sm);
    var b=document.createElement("button");b.type="button";b.className="btn";b.dataset.i=i;
    b.onclick=function(){if(left(i)>0)return;window.open(v.url,"_blank","noopener");store(vkey(i),String(Date.now()));renderVoteBtns()};
    d.appendChild(n);d.appendChild(b);s.appendChild(d)});
  renderVoteBtns();
}
setInterval(function(){if(S.user&&$("v-vote").classList.contains("on"))renderVoteBtns()},1000);
function renderCart(){
  var u=$("cartList");u.innerHTML="";var tot=0;
  if(!S.cart.length){var li=document.createElement("li");li.textContent=t("empty");u.appendChild(li)}
  S.cart.forEach(function(id,i){var x=CONFIG.items.filter(function(y){return y.id===id})[0];tot+=x.price;
    var li=document.createElement("li");var a=document.createElement("span");a.textContent=x[S.lang][0]+" — "+money(x.price);
    var r=document.createElement("button");r.type="button";r.className="chip";r.textContent=t("remove");r.onclick=function(){S.cart.splice(i,1);renderCart()};
    li.appendChild(a);li.appendChild(r);u.appendChild(li)});
  $("total").textContent=t("total")+": "+money(tot);
  $("checkout").disabled=!S.cart.length;$("checkout").style.opacity=S.cart.length?1:.5;
}
function renderLogin(){
  var inn=!!S.user;
  $("lgBox").style.display=inn?"none":"block";$("lgOut").style.display=inn?"block":"none";
  $("lgH").textContent=S.reg?t("reg_h"):t("login_h");
  $("lgGo").textContent=S.reg?t("go_reg"):t("go_login");
  $("lgSwap").textContent=S.reg?t("to_login"):t("to_reg");
  $("demo").textContent=CONFIG.demoNotice?t("demo"):"";
  $("lPass").autocomplete=S.reg?"new-password":"current-password";
  var w=$("who");w.classList.toggle("on",inn);$("navLogin").style.display=inn?"none":"";
  if(inn){w.textContent=S.user;$("lgHi").textContent=t("hi")+S.user}
  renderVotes();
}
function route(){
  var h=(location.hash||"#home").slice(1);if(!$("v-"+h))h="home";
  document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",v.id==="v-"+h)});
  document.querySelectorAll("nav a").forEach(function(a){if(a.getAttribute("href")==="#"+h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
$("lang").onclick=function(){S.lang=S.lang==="en"?"fr":"en";store("jk-lang",S.lang);render()};
$("theme").onclick=function(){S.theme=S.theme==="dark"?"light":"dark";store("jk-theme",S.theme);document.documentElement.setAttribute("data-theme",S.theme);render()};
$("copy").onclick=function(){var d=function(){toast(t("copied"))};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(CONFIG.ip).then(d,d)}else d()};
$("checkout").onclick=function(){toast(t("pay"))};
$("lgSwap").onclick=function(e){e.preventDefault();S.reg=!S.reg;renderLogin()};
$("lgGo").onclick=function(){var u=$("lUser").value.trim();if(!u||!$("lPass").value){toast(t("fill"));return}S.user=u;$("lPass").value="";renderLogin()};
$("logout").onclick=function(){S.user=null;renderLogin()};
window.addEventListener("hashchange",route);
var sl=store("jk-lang"),st=store("jk-theme");
S.lang=sl==="fr"||sl==="en"?sl:((navigator.language||"").toLowerCase().indexOf("fr")===0?"fr":"en");
S.theme=st==="light"?"light":"dark";
document.documentElement.setAttribute("data-theme",S.theme);
render();route();
</script>
